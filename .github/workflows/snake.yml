name: Generate Crimson Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: AyuShetty
          outputs: |
            output/github-contribution-grid-snake.svg?color_snake=#DC2626&color_dots=#18181B,#3F3F46,#71717A,#A1A1AA,#FAFAFA
            output/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#DC2626&color_dots=#18181B,#3F3F46,#71717A,#A1A1AA,#FAFAFA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Snake SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
