name: AYU.OS Build & Deploy

on:
  schedule:
    # Run daily at 06:00 UTC to refresh stats
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'components/**'
      - 'scripts/**'
      - 'tokens/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Validate JSON data files
        run: |
          for file in data/*.json; do
            python3 -m json.tool "$file" >/dev/null
          done
      
      - name: Validate SVG components
        run: |
          python3 scripts/validate_svgs.py components
      
      - name: Check Python syntax
        run: python3 -m compileall -q scripts

      - name: Check profile contract
        run: python3 scripts/validate_profile.py

  build:
    name: Build & Deploy
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Fetch GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PROFILE_LOGIN: AyuShetty
        run: python3 scripts/fetch_github_stats.py
      
      - name: Build README and visual assets
        run: python3 scripts/build.py

      - name: Re-run profile contract checks
        run: python3 scripts/validate_profile.py
      
      - name: Commit & Push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add README.md assets/profile data/stats.json
          if git diff --cached --quiet; then
            echo "No generated changes to publish"
          else
            git commit -m "chore: refresh profile README [skip ci]"
            git push
          fi
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ayu-os-build
          path: |
            README.md
            assets/profile/
            dist/README.md
          retention-days: 7

  notify:
    name: Notify on Failure
    needs: [validate, build]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        run: |
          echo "Build failed! Check Actions tab for details."
          # Could add Slack/Discord webhook here