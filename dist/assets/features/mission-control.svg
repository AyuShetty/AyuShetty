<?xml version="1.0" encoding="UTF-8"?>
<!-- AYU.OS - Mission Control Component
Purpose: Central dashboard showing system modules and status
Composes: panel, chip, icon (kernel, mission, ai, database, filesystem, telemetry, network, archive)
Spec: COMPONENT_SPEC.md, TOKENS.md
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img">
  <title>AYU OS Mission Control</title>
  <desc>Central dashboard displaying active system modules with status indicators for AYU.OS.</desc>
  <defs>
    <style>
      .ayu-surface { fill: #09090B; }
      .ayu-surface-raised { fill: #111111; }
      .ayu-border { fill: none; stroke: #27272A; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
      .ayu-accent { fill: none; stroke: #DC2626; stroke-width: 1.5; opacity: 0.6; stroke-linecap: round; stroke-linejoin: round; }
      .ayu-separator { stroke: #27272A; stroke-width: 1.5; }
      .ayu-text-primary { fill: #FAFAFA; font-family: "JetBrains Mono", Menlo, monospace; font-size: 11px; }
      .ayu-text-muted { fill: #A1A1AA; font-family: "JetBrains Mono", Menlo, monospace; font-size: 10px; }
      .ayu-text-heading { fill: #FAFAFA; font-family: "JetBrains Mono", Menlo, monospace; font-size: 14px; font-weight: 600; }
      .ayu-success { fill: #22C55E; }
      .ayu-warning { fill: #EAB308; }
      .ayu-standby { fill: #71717A; }
    </style>
  </defs>

  <!-- Background Panel -->
  <rect class="ayu-surface" width="1000" height="600" rx="12"/>
  <rect class="ayu-border" width="1000" height="600" rx="12"/>

  <!-- Corner Accents -->
  <g id="ayu-corner-group">
    <path class="ayu-accent" d="M 28 12 L 28 28 L 12 28"/>
    <path class="ayu-accent" d="M 972 12 L 972 28 L 988 28"/>
    <path class="ayu-accent" d="M 28 588 L 28 572 L 12 572"/>
    <path class="ayu-accent" d="M 972 588 L 972 572 L 988 572"/>
  </g>

  <!-- Header -->
  <g id="ayu-header-group">
    <text class="ayu-text-heading" x="40" y="44">MISSION CONTROL</text>
    <text class="ayu-text-muted" x="40" y="64">Active modules and system status</text>
    <line class="ayu-separator" x1="32" y1="76" x2="968" y2="76"/>
  </g>

  <!-- Module Grid: 2 columns x 4 rows -->
  <g id="ayu-modules-group">
    <!-- Module 1: Kernel -->
    <g class="ayu-module" transform="translate(40, 100)">
      <rect class="ayu-surface-raised" width="460" height="110" rx="8"/>
      <rect class="ayu-border" width="460" height="110" rx="8"/>
      <!-- Icon placeholder - kernel -->
      <circle class="ayu-success" cx="30" cy="55" r="12"/>
      <text class="ayu-text-primary" x="55" y="44">KERNEL</text>
      <text class="ayu-text-muted" x="55" y="60">System initialization and runtime management</text>
      <!-- Status chip -->
      <rect class="ayu-surface" x="300" y="20" width="140" height="32" rx="6"/>
      <circle class="ayu-success" cx="312" cy="36" r="4"/>
      <text class="ayu-text-primary" x="320" y="40">ACTIVE</text>
      <!-- Version -->
      <text class="ayu-text-muted" x="300" y="85">v7.0.0 — Core</text>
    </g>

    <!-- Module 2: Mission Control -->
    <g class="ayu-module" transform="translate(520, 100)">
      <rect class="ayu-surface-raised" width="460" height="110" rx="8"/>
      <rect class="ayu-border" width="460" height="110" rx="8"/>
      <circle class="ayu-success" cx="30" cy="55" r="12"/>
      <text class="ayu-text-primary" x="55" y="44">MISSION CONTROL</text>
      <text class="ayu-text-muted" x="55" y="60">Active projects and career timeline</text>
      <rect class="ayu-surface" x="300" y="20" width="140" height="32" rx="6"/>
      <circle class="ayu-success" cx="312" cy="36" r="4"/>
      <text class="ayu-text-primary" x="320" y="40">ACTIVE</text>
      <text class="ayu-text-muted" x="300" y="85">4 projects tracked</text>
    </g>

    <!-- Module 3: AI Core -->
    <g class="ayu-module" transform="translate(40, 230)">
      <rect class="ayu-surface-raised" width="460" height="110" rx="8"/>
      <rect class="ayu-border" width="460" height="110" rx="8"/>
      <circle class="ayu-success" cx="30" cy="55" r="12"/>
      <text class="ayu-text-primary" x="55" y="44">AI CORE</text>
      <text class="ayu-text-muted" x="55" y="60">Reasoning engine and local LLM orchestration</text>
      <rect class="ayu-surface" x="300" y="20" width="140" height="32" rx="6"/>
      <circle class="ayu-success" cx="312" cy="36" r="4"/>
      <text class="ayu-text-primary" x="320" y="40">ACTIVE</text>
      <text class="ayu-text-muted" x="300" y="85">Ollama + Playwright</text>
    </g>

    <!-- Module 4: Research Database -->
    <g class="ayu-module" transform="translate(520, 230)">
      <rect class="ayu-surface-raised" width="460" height="110" rx="8"/>
      <rect class="ayu-border" width="460" height="110" rx="8"/>
      <circle class="ayu-success" cx="30" cy="55" r="12"/>
      <text class="ayu-text-primary" x="55" y="44">RESEARCH DATABASE</text>
      <text class="ayu-text-muted" x="55" y="60">Articles, blogs, and documentation</text>
      <rect class="ayu-surface" x="300" y="20" width="140" height="32" rx="6"/>
      <circle class="ayu-success" cx="312" cy="36" r="4"/>
      <text class="ayu-text-primary" x="320" y="40">ACTIVE</text>
      <text class="ayu-text-muted" x="300" y="85">200+ articles published</text>
    </g>

    <!-- Module 5: Filesystem -->
    <g class="ayu-module" transform="translate(40, 360)">
      <rect class="ayu-surface-raised" width="460" height="110" rx="8"/>
      <rect class="ayu-border" width="460" height="110" rx="8"/>
      <circle class="ayu-success" cx="30" cy="55" r="12"/>
      <text class="ayu-text-primary" x="55" y="44">FILESYSTEM</text>
      <text class="ayu-text-muted" x="55" y="60">Public repositories and subsystems</text>
      <rect class="ayu-surface" x="300" y="20" width="140" height="32" rx="6"/>
      <circle class="ayu-success" cx="312" cy="36" r="4"/>
      <text class="ayu-text-primary" x="320" y="40">ACTIVE</text>
      <text class="ayu-text-muted" x="300" y="85">14 repositories</text>
    </g>

    <!-- Module 6: Telemetry -->
    <g class="ayu-module" transform="translate(520, 360)">
      <rect class="ayu-surface-raised" width="460" height="110" rx="8"/>
      <rect class="ayu-border" width="460" height="110" rx="8"/>
      <circle class="ayu-success" cx="30" cy="55" r="12"/>
      <text class="ayu-text-primary" x="55" y="44">TELEMETRY</text>
      <text class="ayu-text-muted" x="55" y="60">GitHub statistics and system metrics</text>
      <rect class="ayu-surface" x="300" y="20" width="140" height="32" rx="6"/>
      <circle class="ayu-success" cx="312" cy="36" r="4"/>
      <text class="ayu-text-primary" x="320" y="40">ACTIVE</text>
      <text class="ayu-text-muted" x="300" y="85">Auto-refreshed daily</text>
    </g>

    <!-- Module 7: Network -->
    <g class="ayu-module" transform="translate(40, 490)">
      <rect class="ayu-surface-raised" width="460" height="110" rx="8"/>
      <rect class="ayu-border" width="460" height="110" rx="8"/>
      <circle class="ayu-standby" cx="30" cy="55" r="12"/>
      <text class="ayu-text-primary" x="55" y="44">NETWORK</text>
      <text class="ayu-text-muted" x="55" y="60">Connections and packet routing</text>
      <rect class="ayu-surface" x="300" y="20" width="140" height="32" rx="6"/>
      <circle class="ayu-warning" cx="312" cy="36" r="4"/>
      <text class="ayu-text-primary" x="320" y="40">STANDBY</text>
      <text class="ayu-text-muted" x="300" y="85">Awaiting connection</text>
    </g>

    <!-- Module 8: Archive -->
    <g class="ayu-module" transform="translate(520, 490)">
      <rect class="ayu-surface-raised" width="460" height="110" rx="8"/>
      <rect class="ayu-border" width="460" height="110" rx="8"/>
      <circle class="ayu-standby" cx="30" cy="55" r="12"/>
      <text class="ayu-text-primary" x="55" y="44">ARCHIVE</text>
      <text class="ayu-text-muted" x="55" y="60">Past work and deprecated modules</text>
      <rect class="ayu-surface" x="300" y="20" width="140" height="32" rx="6"/>
      <circle class="ayu-warning" cx="312" cy="36" r="4"/>
      <text class="ayu-text-primary" x="320" y="40">STANDBY</text>
      <text class="ayu-text-muted" x="300" y="85">3 archived projects</text>
    </g>
  </g>

  <!-- Footer -->
  <g id="ayu-footer-group">
    <line class="ayu-separator" x1="32" y1="556" x2="968" y2="556"/>
    <text class="ayu-text-muted" x="40" y="580">AYU.OS v7.0.0 — All critical systems operational</text>
    <text class="ayu-text-muted" x="800" y="580">Last sync: {{LAST_SYNC}}</text>
  </g>
</svg>