<?xml version="1.0" encoding="UTF-8"?><!-- AYU.OS - Window Component Purpose: Window with title bar and controls Version: 1.0 Spec: COMPONENT_SPEC.md, TOKENS.md
--><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img"><title>AYU OS Window</title><desc>Window component with title bar, window controls, and content area for AYU.OS modules.</desc><defs><style> .ayu-surface { fill: #09090B; } .ayu-border { fill: none; stroke: #27272A; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; } .ayu-title-bar { fill: #111111; } .ayu-control-close { fill: #EF4444; opacity: 0.8; } .ayu-control-minimize { fill: #EAB308; opacity: 0.8; } .ayu-control-maximize { fill: #22C55E; opacity: 0.8; } .ayu-separator { stroke: #27272A; stroke-width: 1.5; } </style></defs><!-- Background --><rect class="ayu-surface" width="1200" height="700" rx="12"/><!-- Border --><rect class="ayu-border" width="1200" height="700" rx="12"/><!-- Title Bar: 40px height, 32px padding from top --><g id="ayu-title-bar-group"><rect class="ayu-title-bar" x="1" y="1" width="1198" height="40" rx="12"/><rect class="ayu-border" x="1" y="1" width="1198" height="40" rx="12"/><line class="ayu-separator" x1="1" y1="41" x2="1199" y2="41"/></g><!-- Window Controls: 28px from left, vertically centered in 40px bar --><g id="ayu-window-controls-group"><circle class="ayu-control-close" cx="48" cy="21" r="6"/><circle class="ayu-control-minimize" cx="76" cy="21" r="6"/><circle class="ayu-control-maximize" cx="104" cy="21" r="6"/></g><!-- Body --><g id="ayu-body-group"><!-- Content injected here --></g><!-- Footer --><g id="ayu-footer-group"><line class="ayu-separator" x1="32" y1="644" x2="1168" y2="644"/></g></svg>