<?xml version="1.0" encoding="UTF-8"?><!-- AYU.OS - Chip Component Purpose: Compact status indicator chip Version: 1.0 Spec: COMPONENT_SPEC.md, TOKENS.md
--><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" role="img"><title>AYU OS Chip</title><desc>Compact status chip with indicator dot and label for AYU.OS modules.</desc><defs><style> .ayu-surface { fill: #111111; } .ayu-border { fill: none; stroke: #27272A; stroke-width: 1.5; } .ayu-accent { fill: #DC2626; } .ayu-text-primary { fill: #FAFAFA; font-family: Menlo, monospace; font-size: 11px; } </style></defs><!-- Chip Background --><rect class="ayu-surface" width="200" height="60" rx="8"/><!-- Border --><rect class="ayu-border" width="200" height="60" rx="8"/><!-- Status Dot --><circle class="ayu-accent" cx="24" cy="30" r="4"/><!-- Label --><text class="ayu-text-primary" x="40" y="35">STATUS_ACTIVE</text></svg>