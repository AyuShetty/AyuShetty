<?xml version="1.0" encoding="UTF-8"?>
<!-- AYU.OS - Timeline Entry Component
Purpose: Reusable timeline entry for experience/research timeline
Composes: panel, divider, chip
Spec: COMPONENT_SPEC.md, TOKENS.md
Parameters: {{PERIOD}}, {{ROLE}}, {{COMPANY}}, {{LOCATION}}, {{DESCRIPTION}}, {{ACHIEVEMENTS}}, {{TECHNOLOGIES}}, {{CURRENT}}
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" role="img">
  <title>{{ROLE}} at {{COMPANY}} ({{PERIOD}})</title>
  <desc>Timeline entry for {{ROLE}} at {{COMPANY}} from {{PERIOD}}.</desc>
  <defs>
    <style>
      .ayu-surface { fill: #09090B; }
      .ayu-surface-raised { fill: #111111; }
      .ayu-border { fill: none; stroke: #27272A; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
      .ayu-accent { fill: none; stroke: #DC2626; stroke-width: 1.5; opacity: 0.6; stroke-linecap: round; stroke-linejoin: round; }
      .ayu-separator { stroke: #27272A; stroke-width: 1.5; }
      .ayu-timeline-line { stroke: #27272A; stroke-width: 2; stroke-linecap: round; }
      .ayu-timeline-dot { fill: #DC2626; }
      .ayu-timeline-dot-current { fill: #22C55E; animation: pulse 2s infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 1; r: 8; }
        50% { opacity: 0.5; r: 12; }
      }
      .ayu-text-primary { fill: #FAFAFA; font-family: "JetBrains Mono", Menlo, monospace; font-size: 11px; }
      .ayu-text-muted { fill: #A1A1AA; font-family: "JetBrains Mono", Menlo, monospace; font-size: 10px; }
      .ayu-text-heading { fill: #FAFAFA; font-family: "JetBrains Mono", Menlo, monospace; font-size: 13px; font-weight: 600; }
      .ayu-success { fill: #22C55E; }
      .ayu-warning { fill: #EAB308; }
      .ayu-tech-tag { fill: #1A1A1A; stroke: #27272A; stroke-width: 1; }
      .ayu-tech-text { fill: #D4D4D8; font-family: "JetBrains Mono", Menlo, monospace; font-size: 9px; }
    </style>
  </defs>

  <!-- Timeline line (vertical) -->
  <line class="ayu-timeline-line" x1="80" y1="0" x2="80" y2="160"/>
  <!-- Timeline dot -->
  <circle class="ayu-timeline-dot{{#if CURRENT}} ayu-timeline-dot-current{{/if}}" cx="80" cy="24" r="8"/>

  <!-- Content Panel -->
  <g transform="translate(112, 16)">
    <rect class="ayu-surface-raised" width="856" height="128" rx="8"/>
    <rect class="ayu-border" width="856" height="128" rx="8"/>

    <!-- Header Row -->
    <g id="ayu-header" transform="translate(16, 0)">
      <text class="ayu-text-heading" x="0" y="20">{{ROLE}}</text>
      <text class="ayu-text-muted" x="0" y="40">{{COMPANY}} • {{LOCATION}}</text>

      <!-- Period Badge -->
      <g transform="translate(550, -16)">
        <rect class="ayu-surface" width="140" height="28" rx="6"/>
        <rect class="ayu-border" width="140" height="28" rx="6"/>
        <text class="ayu-text-primary" x="70" y="18" text-anchor="middle">{{PERIOD}}</text>
      </g>

      <!-- Current Badge -->
      {{#if CURRENT}}
      <g transform="translate(710, -16)">
        <rect class="ayu-surface" width="80" height="28" rx="6"/>
        <rect class="ayu-border" width="80" height="28" rx="6" stroke="#22C55E"/>
        <circle class="ayu-success" cx="16" cy="14" r="4"/>
        <text class="ayu-text-primary" x="28" y="18">CURRENT</text>
      </g>
      {{/if}}

      <!-- Type Badge -->
      <g transform="translate(810, -16)">
        <rect class="ayu-surface" width="60" height="28" rx="6"/>
        <rect class="ayu-border" width="60" height="28" rx="6"/>
        <text class="ayu-text-muted" x="30" y="18" text-anchor="middle">{{TYPE}}</text>
      </g>
    </g>

    <line class="ayu-separator" x1="16" y1="52" x2="840" y2="52"/>

    <!-- Description -->
    <g id="ayu-description" transform="translate(16, 60)">
      <text class="ayu-text-primary" x="0" y="0" style="font-size: 10px;">{{DESCRIPTION}}</text>
    </g>

    <!-- Achievements -->
    <g id="ayu-achievements" transform="translate(16, 82)">
      {{#each ACHIEVEMENTS}}
      <text class="ayu-success" x="0" y="{{y}}">▸</text>
      <text class="ayu-text-primary" x="14" y="{{y}}" style="font-size: 10px;">{{this}}</text>
      {{/each}}
    </g>

    <!-- Technologies -->
    <g id="ayu-technologies" transform="translate(16, 110)">
      <text class="ayu-text-muted" x="0" y="0">Tech:</text>
      {{#each TECHNOLOGIES}}
      <g class="ayu-tech-tag-group" transform="translate({{x}}, -4)">
        <rect class="ayu-tech-tag" x="0" y="0" width="{{width}}" height="18" rx="3"/>
        <text class="ayu-tech-text" x="{{textX}}" y="12" text-anchor="middle">{{name}}</text>
      </g>
      {{/each}}
    </g>
  </g>
</svg>