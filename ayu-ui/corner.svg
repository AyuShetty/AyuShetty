<?xml version="1.0" encoding="UTF-8"?>
<!--
  AYU.OS - Corner Component
  Purpose: Single reusable corner accent bracket
  Version: 1.0
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img">
  <title>AYU OS Corner</title>
  <desc>Single L-shaped corner accent bracket for AYU.OS HUD panels and windows.</desc>

  <defs>
    <style>
      .ayu-corner { fill: none; stroke: #DC2626; stroke-width: 1.5; opacity: 0.6; }
    </style>
  </defs>

  <!-- Corner Bracket -->
  <path class="ayu-corner" d="M 20 8 L 20 44 L 8 44"/>
</svg>
