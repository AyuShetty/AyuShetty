<?xml version="1.0" encoding="UTF-8"?>
<!--
  AYU.OS - Badge Component
  Purpose: Compact status badge
  Version: 1.0
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" role="img">
  <title>AYU OS Badge</title>
  <desc>Compact status badge with indicator and label for AYU.OS telemetry.</desc>

  <defs>
    <style>
      .ayu-badge-bg { fill: #161616; stroke: #27272A; stroke-width: 1; }
      .ayu-badge-text { fill: #A1A1AA; font-family: Menlo, monospace; font-size: 10px; }
      .ayu-badge-value { fill: #FAFAFA; font-family: Menlo, monospace; font-size: 14px; }
    </style>
  </defs>

  <!-- Badge Background -->
  <rect class="ayu-badge-bg" width="200" height="60" rx="8"/>

  <!-- Label -->
  <text class="ayu-badge-text" x="16" y="22">UPTIME</text>

  <!-- Value -->
  <text class="ayu-badge-value" x="16" y="44">99.97%</text>
</svg>
