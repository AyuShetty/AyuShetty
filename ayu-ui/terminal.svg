<?xml version="1.0" encoding="UTF-8"?><!-- AYU.OS - Terminal Component Purpose: Terminal window with prompt and output area Version: 1.0 Spec: COMPONENT_SPEC.md, TOKENS.md
--><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img"><title>AYU OS Terminal</title><desc>Terminal window with prompt area and output area for AYU.OS modules.</desc><defs><style> .ayu-surface { fill: #09090B; } .ayu-surface-raised { fill: #111111; } .ayu-border { fill: none; stroke: #27272A; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; } .ayu-accent { fill: none; stroke: #DC2626; stroke-width: 1.5; opacity: 0.6; stroke-linecap: round; stroke-linejoin: round; } .ayu-separator { stroke: #27272A; stroke-width: 1.5; } .ayu-text-primary { fill: #FAFAFA; font-family: Menlo, monospace; font-size: 11px; } .ayu-text-muted { fill: #A1A1AA; font-family: Menlo, monospace; font-size: 10px; } .ayu-success { fill: #22C55E; } </style></defs><!-- Background --><rect class="ayu-surface" width="1000" height="500" rx="12"/><!-- Border --><rect class="ayu-border" width="1000" height="500" rx="12"/><!-- Corner Accents --><g id="ayu-corner-group"><path class="ayu-accent" d="M 28 12 L 28 28 L 12 28"/><path class="ayu-accent" d="M 972 12 L 972 28 L 988 28"/><path class="ayu-accent" d="M 28 488 L 28 472 L 12 472"/><path class="ayu-accent" d="M 972 488 L 972 472 L 988 472"/></g><!-- Header --><g id="ayu-header-group"><line class="ayu-separator" x1="32" y1="56" x2="968" y2="56"/><text class="ayu-text-primary" x="40" y="42">TERMINAL</text><circle class="ayu-success" cx="920" cy="40" r="4"/><text class="ayu-text-muted" x="936" y="44">ACTIVE</text></g><!-- Body: Output Area --><g id="ayu-body-group"><text class="ayu-text-muted" x="40" y="80">$ ayu-os init</text><text class="ayu-text-muted" x="40" y="100">[INFO] Kernel loaded successfully.</text><text class="ayu-text-muted" x="40" y="120">[INFO] Mounting filesystem...</text><text class="ayu-success" x="40" y="140">[OK] System ready.</text><text class="ayu-text-primary" x="40" y="160">$</text></g><!-- Footer --><g id="ayu-footer-group"><line class="ayu-separator" x1="32" y1="444" x2="968" y2="444"/></g></svg>