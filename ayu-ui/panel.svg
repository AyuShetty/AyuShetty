<?xml version="1.0" encoding="UTF-8"?>
<!--
  AYU.OS - Panel Component
  Purpose: Reusable container for HUD modules
  Version: 1.0
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img">
  <title>AYU OS Panel</title>
  <desc>Reusable dark panel container with corner accents, header, body, and footer regions for AYU.OS HUD modules.</desc>

  <defs>
    <style>
      .ayu-panel-bg { fill: #09090B; }
      .ayu-panel-border { fill: none; stroke: #27272A; stroke-width: 1; }
      .ayu-corner { fill: none; stroke: #DC2626; stroke-width: 1.5; opacity: 0.6; }
      .ayu-separator { stroke: #27272A; stroke-width: 1; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="ayu-panel-bg" width="1000" height="500" rx="12"/>

  <!-- Border -->
  <rect class="ayu-panel-border" width="1000" height="500" rx="12"/>

  <!-- Corner Accents -->
  <g id="ayu-corner-group">
    <path class="ayu-corner" d="M 24 8 L 24 28 L 8 28"/>
    <path class="ayu-corner" d="M 976 8 L 976 28 L 992 28"/>
    <path class="ayu-corner" d="M 24 492 L 24 472 L 8 472"/>
    <path class="ayu-corner" d="M 976 492 L 976 472 L 992 472"/>
  </g>

  <!-- Header -->
  <g id="ayu-header-group">
    <line class="ayu-separator" x1="40" y1="56" x2="960" y2="56"/>
  </g>

  <!-- Body -->
  <g id="ayu-body-group">
    <!-- Content injected here -->
  </g>

  <!-- Footer -->
  <g id="ayu-footer-group">
    <line class="ayu-separator" x1="40" y1="444" x2="960" y2="444"/>
  </g>
</svg>
