<?xml version="1.0" encoding="UTF-8"?>
<!--
  AYU.OS - Radar Component
  Purpose: Animated radar scan effect
  Version: 1.0
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img">
  <title>AYU OS Radar</title>
  <desc>Radar scan effect for AYU.OS network and detection modules.</desc>

  <defs>
    <style>
      .ayu-radar-ring { fill: none; stroke: #27272A; stroke-width: 1; }
      .ayu-radar-sweep { fill: none; stroke: #DC2626; stroke-width: 2; opacity: 0.6; }
      .ayu-radar-center { fill: #DC2626; }
    </style>
  </defs>

  <!-- Radar Rings -->
  <circle class="ayu-radar-ring" cx="100" cy="100" r="80"/>
  <circle class="ayu-radar-ring" cx="100" cy="100" r="60"/>
  <circle class="ayu-radar-ring" cx="100" cy="100" r="40"/>
  <circle class="ayu-radar-ring" cx="100" cy="100" r="20"/>

  <!-- Crosshairs -->
  <line x1="100" y1="10" x2="100" y2="190" stroke="#27272A" stroke-width="0.5"/>
  <line x1="10" y1="100" x2="190" y2="100" stroke="#27272A" stroke-width="0.5"/>

  <!-- Sweep -->
  <line class="ayu-radar-sweep" x1="100" y1="100" x2="100" y2="20"/>

  <!-- Center -->
  <circle class="ayu-radar-center" cx="100" cy="100" r="4"/>
</svg>
