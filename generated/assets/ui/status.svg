<?xml version="1.0" encoding="UTF-8"?>
<!--
  AYU.OS - Status Component
  Purpose: Status indicator with dot and label
  Version: 1.0
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" role="img">
  <title>AYU OS Status</title>
  <desc>Status indicator with colored dot and label for AYU.OS telemetry.</desc>

  <defs>
    <style>
      .ayu-status-dot { fill: #22C55E; }
      .ayu-status-text { fill: #FAFAFA; font-family: Menlo, monospace; font-size: 11px; }
    </style>
  </defs>

  <!-- Status Dot -->
  <circle class="ayu-status-dot" cx="16" cy="30" r="5"/>

  <!-- Label -->
  <text class="ayu-status-text" x="30" y="35">OPERATIONAL</text>
</svg>
