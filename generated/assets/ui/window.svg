<?xml version="1.0" encoding="UTF-8"?>
<!--
  AYU.OS - Window Component
  Purpose: Window with title bar and controls
  Version: 1.0
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img">
  <title>AYU OS Window</title>
  <desc>Window component with title bar, window controls, and content area for AYU.OS modules.</desc>

  <defs>
    <style>
      .ayu-window-bg { fill: #09090B; }
      .ayu-window-border { fill: none; stroke: #27272A; stroke-width: 1; }
      .ayu-title-bar { fill: #111111; }
      .ayu-control { fill: #DC2626; opacity: 0.8; }
      .ayu-control:hover { opacity: 1; }
      .ayu-separator { stroke: #27272A; stroke-width: 1; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="ayu-window-bg" width="1000" height="500" rx="12"/>

  <!-- Border -->
  <rect class="ayu-window-border" width="1000" height="500" rx="12"/>

  <!-- Title Bar -->
  <g id="ayu-title-bar-group">
    <rect class="ayu-title-bar" x="1" y="1" width="998" height="40" rx="12"/>
    <rect fill="none" stroke="#27272A" stroke-width="1" x="1" y="1" width="998" height="40" rx="12"/>
    <line class="ayu-separator" x1="1" y1="41" x2="999" y2="41"/>
  </g>

  <!-- Window Controls -->
  <g id="ayu-window-controls-group">
    <circle class="ayu-control" cx="28" cy="21" r="6"/>
    <circle fill="#EAB308" cx="48" cy="21" r="6"/>
    <circle fill="#22C55E" cx="68" cy="21" r="6"/>
  </g>

  <!-- Body -->
  <g id="ayu-body-group">
    <!-- Content injected here -->
  </g>

  <!-- Footer -->
  <g id="ayu-footer-group">
    <line class="ayu-separator" x1="40" y1="444" x2="960" y2="444"/>
  </g>
</svg>
