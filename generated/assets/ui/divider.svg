<?xml version="1.0" encoding="UTF-8"?>
<!--
  AYU.OS - Divider Component
  Purpose: Horizontal or vertical separator with optional label
  Version: 1.0
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 40" role="img">
  <title>AYU OS Divider</title>
  <desc>Reusable horizontal divider with optional center label for AYU.OS interface sections.</desc>

  <defs>
    <style>
      .ayu-divider-line { stroke: #27272A; stroke-width: 1; }
      .ayu-divider-label { fill: #A1A1AA; font-family: Menlo, monospace; font-size: 11px; }
    </style>
  </defs>

  <!-- Line -->
  <line class="ayu-divider-line" x1="0" y1="20" x2="1000" y2="20"/>

  <!-- Center Label -->
  <g id="ayu-divider-label-group">
    <rect fill="#09090B" x="440" y="12" width="120" height="16"/>
    <text class="ayu-divider-label" x="500" y="24" text-anchor="middle">SECTION</text>
  </g>
</svg>
