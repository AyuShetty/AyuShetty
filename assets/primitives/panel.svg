<?xml version="1.0" encoding="UTF-8"?><!-- AYU.OS - Panel Component Purpose: Reusable container for HUD modules Version: 1.0 Spec: COMPONENT_SPEC.md, TOKENS.md
--><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img"><title>AYU OS Panel</title><desc>Reusable dark panel container with corner accents, header, body, and footer regions for AYU.OS HUD modules.</desc><defs><style> .ayu-surface { fill: #09090B; } .ayu-surface-raised { fill: #111111; } .ayu-border { fill: none; stroke: #27272A; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; } .ayu-accent { fill: none; stroke: #DC2626; stroke-width: 1.5; opacity: 0.6; stroke-linecap: round; stroke-linejoin: round; } .ayu-separator { stroke: #27272A; stroke-width: 1.5; } .ayu-text-primary { fill: #FAFAFA; font-family: Menlo, monospace; font-size: 11px; } .ayu-text-muted { fill: #A1A1AA; font-family: Menlo, monospace; font-size: 10px; } </style></defs><!-- Background --><rect class="ayu-surface" width="1000" height="500" rx="12"/><!-- Border --><rect class="ayu-border" width="1000" height="500" rx="12"/><!-- Corner Accents: 24px L-brackets positioned inside border, not overlapping --><g id="ayu-corner-group"><!-- Top-left --><path class="ayu-accent" d="M 28 12 L 28 28 L 12 28"/><!-- Top-right --><path class="ayu-accent" d="M 972 12 L 972 28 L 988 28"/><!-- Bottom-left --><path class="ayu-accent" d="M 28 488 L 28 472 L 12 472"/><!-- Bottom-right --><path class="ayu-accent" d="M 972 488 L 972 472 L 988 472"/></g><!-- Header: 32px padding from top, 32px internal height --><g id="ayu-header-group"><line class="ayu-separator" x1="32" y1="56" x2="968" y2="56"/></g><!-- Body: 56px from top (header + padding), 32px internal padding --><g id="ayu-body-group"><!-- Content injected here --></g><!-- Footer: 32px padding from bottom --><g id="ayu-footer-group"><line class="ayu-separator" x1="32" y1="444" x2="968" y2="444"/></g></svg>