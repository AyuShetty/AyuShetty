<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%">
  <defs>
    <style>
      @keyframes space-drift {
        0% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-10px, -15px) scale(1.02); }
        100% { transform: translate(0, 0) scale(1); }
      }
      @keyframes star-twinkle {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.9; }
      }
      @keyframes hud-pulse {
        0%, 100% { stroke: #DC2626; filter: drop-shadow(0 0 1px #DC2626); }
        50% { stroke: #EF4444; filter: drop-shadow(0 0 4px #DC2626); }
      }
      @keyframes scanner-sweep {
        0% { transform: rotate(0deg); opacity: 0.5; }
        50% { opacity: 1; }
        100% { transform: rotate(360deg); opacity: 0.5; }
      }
      @keyframes particle-glow {
        0%, 100% { opacity: 0.1; }
        50% { opacity: 0.8; }
      }
      @keyframes type-boot-sequence {
        0% { opacity: 0; }
        1% { opacity: 1; text-shadow: 0 0 2px #DC2626; }
        5% { opacity: 1; text-shadow: none; }
        98% { opacity: 1; }
        100% { opacity: 1; }
      }
      
      .bg-noir { fill: #050505; }
      .text-log { font-family: 'Courier New', monospace; font-size: 10px; fill: #A1A1AA; }
      .boot-active { animation: type-boot-sequence 15s linear infinite; animation-delay: 0.5s; opacity: 0; }
      .hud-line { fill: none; stroke: #1A1A1A; stroke-width: 1; }
      .hud-accents { stroke: #DC2626; animation: hud-pulse 3s infinite; }
      .scanner { stroke: #DC2626; stroke-width: 1.5; transform-origin: 450px 160px; animation: scanner-sweep 6s linear infinite; }
      .star { fill: #FAFAFA; animation: star-twinkle 3s infinite ease-in-out; opacity: 0.3; }
      .particle { fill: #DC2626; animation: particle-glow 2s infinite ease-in-out; }
      
      .galaxy-cloud { opacity: 0.15; animation: space-drift 10s infinite ease-in-out; }
    </style>
    
    <radialGradient id="nebula-red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-arc" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#27272A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect class="bg-noir" width="900" height="320" rx="8" />
  
  <g class="galaxy-cloud">
    <ellipse cx="450" cy="160" rx="350" ry="120" fill="url(#nebula-red)" />
    <ellipse cx="700" cy="80" rx="200" ry="100" fill="url(#nebula-arc)" />
  </g>
  
  <g>
    <circle class="star" cx="120" cy="40" r="1" style="animation-delay: 0.2s;" />
    <circle class="star" cx="280" cy="80" r="1.5" style="animation-delay: 0.7s;" />
    <circle class="star" cx="420" cy="30" r="1" style="animation-delay: 1.1s;" />
    <circle class="star" cx="750" cy="110" r="1.5" style="animation-delay: 0.4s;" />
    <circle class="star" cx="830" cy="40" r="1" style="animation-delay: 1.5s;" />
    <circle class="star" cx="150" cy="220" r="1" style="animation-delay: 0.9s;" />
    <circle class="star" cx="620" cy="250" r="1.5" style="animation-delay: 1.3s;" />
  </g>
  
  <g class="boot-active">
    <text x="30" y="30" class="text-log">[ SYS_INIT ] AYU.OS V7.0.0 Loading Neural Core...</text>
    <text x="30" y="45" class="text-log">[ LOADED ] /dev/perception.module</text>
    <text x="30" y="60" class="text-log">[ LOADED ] /dev/automation_loops.module</text>
    <text x="30" y="75" class="text-log">[ LOADED ] /dev/ethereum_protocol.module</text>
    <text x="30" y="90" class="text-log">[ DIAGNOSTIC ] Local LLM Status: Optimal [🟢]</text>
    <text x="30" y="105" class="text-log">[ AUTHN_SCAN ] Initialize Visitor Identification Loop...</text>
  </g>
  
  <g class="radar-scan">
    <circle class="hud-line scanner" cx="450" cy="160" r="120" />
    <circle class="hud-line hud-accents" cx="450" cy="160" r="100" stroke-dasharray="10 5" />
    <circle class="hud-line" cx="450" cy="160" r="80" />
    <circle class="hud-line" cx="450" cy="160" r="60" />
    
    <circle class="particle" cx="480" cy="190" r="2" style="animation-delay: 0.1s;"/>
    <circle class="particle" cx="420" cy="130" r="1.5" style="animation-delay: 0.3s;"/>
    <circle class="particle" cx="410" cy="190" r="1" style="animation-delay: 0.7s;"/>
    <circle class="particle" cx="490" cy="130" r="1.8" style="animation-delay: 1.1s;"/>
  </g>
  
  <g class="central-avatar">
    <circle class="hud-line" cx="450" cy="160" r="40" stroke-width="2" />
    <text x="450" y="165" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="28" fill="#FAFAFA">A</text>
  </g>
  
  <g>
    <line x1="20" y1="110" x2="880" y2="110" class="hud-line hud-accents" stroke-dasharray="4 4" />
    <line x1="20" y1="210" x2="880" y2="210" class="hud-line hud-accents" stroke-dasharray="4 4" />
  </g>
</svg>
