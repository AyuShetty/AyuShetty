--><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img"><title>AYU OS Dashboard</title><desc>Grid-based dashboard layout with module slots for AYU.OS modules.</desc><defs><style> .ayu-surface { fill: #09090B; } .ayu-border { fill: none; stroke: #27272A; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; } .ayu-accent { fill: none; stroke: #DC2626; stroke-width: 1.5; opacity: 0.6; stroke-linecap: round; stroke-linejoin: round; } .ayu-separator { stroke: #27272A; stroke-width: 1.5; } .ayu-text-primary { fill: #FAFAFA; font-family: Menlo, monospace; font-size: 11px; } .ayu-text-muted { fill: #A1A1AA; font-family: Menlo, monospace; font-size: 10px; } </style></defs><!-- Background --><rect class="ayu-surface" width="1000" height="500" rx="12"/><!-- Border --><rect class="ayu-border" width="1000" height="500" rx="12"/><!-- Corner Accents --><g id="ayu-corner-group"><path class="ayu-accent" d="M 28 12 L 28 28 L 12 28"/><path class="ayu-accent" d="M 972 12 L 972 28 L 988 28"/><path class="ayu-accent" d="M 28 488 L 28 472 L 12 472"/><path class="ayu-accent" d="M 972 488 L 972 472 L 988 472"/></g><!-- Header --><g id="ayu-header-group"><line class="ayu-separator" x1="32" y1="56" x2="968" y2="56"/><text class="ayu-text-primary" x="40" y="42">DASHBOARD</text></g><!-- Body: 2x2 Grid --><g id="ayu-body-group"><!-- Module Slot 1 --><rect class="ayu-border" x="32" y="72" width="460" height="180" rx="8"/><text class="ayu-text-muted" x="48" y="92">MODULE_01</text><!-- Module Slot 2 --><rect class="ayu-border" x="508" y="72" width="460" height="180" rx="8"/><text class="ayu-text-muted" x="524" y="92">MODULE_02</text><!-- Module Slot 3 --><rect class="ayu-border" x="32" y="268" width="460" height="180" rx="8"/><text class="ayu-text-muted" x="48" y="288">MODULE_03</text><!-- Module Slot 4 --><rect class="ayu-border" x="508" y="268" width="460" height="180" rx="8"/><text class="ayu-text-muted" x="524" y="288">MODULE_04</text></g><!-- Footer --><g id="