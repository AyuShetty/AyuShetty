<?xml version="1.0" encoding="UTF-8"?><!-- AYU.OS - Grid Component Purpose: Subtle background grid pattern Version: 1.0 Spec: COMPONENT_SPEC.md, TOKENS.md Grid: 4px base, 32px major
--><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img"><title>AYU OS Grid</title><desc>Subtle 4px grid pattern with major and minor lines for AYU.OS background depth.</desc><defs><style> .ayu-grid-minor { stroke: rgba(255,255,255,.03); stroke-width: 0.5; fill: none; } .ayu-grid-major { stroke: rgba(255,255,255,.06); stroke-width: 0.5; fill: none; } </style><pattern id="ayu-grid-minor" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M 8 0 L 0 0 0 8" class="ayu-grid-minor"/></pattern><pattern id="ayu-grid-major" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="32" height="32" fill="url(#ayu-grid-minor)"/><path d="M 32 0 L 0 0 0 32" class="ayu-grid-major"/></pattern></defs><!-- Grid Background --><rect width="1000" height="500" fill="url(#ayu-grid-major)"/></svg>