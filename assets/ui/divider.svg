<?xml version="1.0" encoding="UTF-8"?><!-- AYU.OS - Divider Component Purpose: Horizontal or vertical separator with optional label Version: 1.0 Spec: COMPONENT_SPEC.md, TOKENS.md
--><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 40" role="img"><title>AYU OS Divider</title><desc>Reusable horizontal divider with optional center label for AYU.OS interface sections.</desc><defs><style> .ayu-separator { stroke: #27272A; stroke-width: 1.5; } .ayu-text-muted { fill: #A1A1AA; font-family: Menlo, monospace; font-size: 11px; } .ayu-surface { fill: #09090B; } </style></defs><!-- Line --><line class="ayu-separator" x1="0" y1="20" x2="1000" y2="20"/><!-- Center Label --><g id="ayu-divider-label-group"><rect class="ayu-surface" x="440" y="12" width="120" height="16"/><text class="ayu-text-muted" x="500" y="24" text-anchor="middle">SECTION</text></g></svg>